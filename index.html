<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi Página Web con Chat Salesforce</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
  </style>
</head>
<body>
  <h1>Mi Página con Chat Integrado</h1>
  <p>El chat debería aparecer en la esquina inferior derecha.</p>

  <script type='text/javascript'>
    function initEmbeddedMessaging() {
      try {
        embeddedservice_bootstrap.settings.language = 'es'; // Cambiado a español
        
        embeddedservice_bootstrap.init(
          '00D2o000000k4H1',
          'Channel_Chat',
          'https://onecrminetum.my.site.com/ESWChannelChat1768480941924',
          {
            scrt2URL: 'https://onecrminetum.my.salesforce-scrt.com'
          }
        );
        
        console.log('Embedded Messaging iniciado correctamente');
      } catch (err) {
        console.error('Error loading Embedded Messaging: ', err);
      }
    }
  </script>
  
  <script 
    type='text/javascript' 
    src='https://onecrminetum.my.site.com/ESWChannelChat1768480941924/assets/js/bootstrap.min.js' 
    onload='initEmbeddedMessaging()'
    onerror="console.error('Error al cargar el script de bootstrap')"
  ></script>
</body>
</html>
